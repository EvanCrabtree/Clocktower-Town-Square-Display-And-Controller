<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blood on the Clocktower - Display</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Crimson Text', serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0f0f 50%, #0f0a1a 100%);
      color: #f0e6d2;
      overflow: hidden;
      height: 100vh;
      position: relative;
      transition: background 1s ease;
      margin: 0;
      padding: 0;
    }
  
  body {
    font-family: 'Crimson Text', serif;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a0f0f 50%, #0f0a1a 100%);
    color: #f0e6d2;
    overflow: hidden;
    height: 100vh;
    position: relative;
    transition: background 1s ease;
    margin: 0;
    padding: 0;
  }

  body.day-theme {
    background: linear-gradient(135deg, #2a4a3a 0%, #3a5f4a 50%, #4a6f5a 100%);
  }

  body.night-theme {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a0f0f 50%, #0f0a1a 100%);
  }

  body::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
      radial-gradient(circle at 20% 80%, rgba(139, 69, 19, 0.1) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(25, 25, 112, 0.1) 0%, transparent 50%),
      radial-gradient(circle at 40% 40%, rgba(178, 34, 34, 0.05) 0%, transparent 50%);
    pointer-events: none;
    transition: opacity 1s ease;
  }

  body.day-theme::before {
    background: 
      radial-gradient(circle at 30% 70%, rgba(255, 223, 0, 0.1) 0%, transparent 50%),
      radial-gradient(circle at 70% 30%, rgba(135, 206, 235, 0.1) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
  }
  
  #playersContainer {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  .player-card {
    position: absolute;
    text-align: center;
    transform: translate(-50%, -50%);
    font-size: clamp(0.8em, 1.3vw, 1.0em);
    white-space: nowrap;
    background: rgba(20, 20, 30, 0.9);
    border: 2.2px solid rgba(139, 69, 19, 0.4);
    border-radius: 12px;
    padding: clamp(4px, 1vw, 6px);
    box-shadow: 
      0 8px 32px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    overflow: hidden;
    width: clamp(120px, 10vw, 160px);
    min-width: 120px;
    max-width: 160px;
  }

  body.day-theme .player-card {
    background: rgba(40, 60, 40, 0.8);
    border-color: rgba(76, 175, 80, 0.4);
    box-shadow: 
      0 8px 32px rgba(0, 0, 0, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
  }

  body.day-theme .player-card.dead {
    background: rgba(70, 74, 82, 0.72);
    border-color: rgba(150, 158, 170, 0.5);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.22),
      inset 0 1px 0 rgba(210, 215, 225, 0.12);
    opacity: 0.72;
  }

  body.day-theme .player-card.on-block {
    border-color: rgba(255, 215, 0, 0.8);
    border-width: 3.3px;
    box-shadow: 
      0 0 20px rgba(255, 215, 0, 0.4),
      0 8px 32px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
    animation: pulse-gold 2s ease-in-out infinite;
  }

  @keyframes pulse-gold {
    0%, 100% {
      box-shadow: 
        0 0 20px rgba(255, 215, 0, 0.4),
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    50% {
      box-shadow: 
        0 0 30px rgba(255, 215, 0, 0.6),
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
  }

  .on-block-label {
    background: linear-gradient(135deg, rgba(178, 34, 34, 0.9), rgba(139, 0, 0, 0.9));
    color: #ffd700;
    font-family: 'Cinzel', serif;
    font-size: 0.75em;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border: 1px solid rgba(255, 215, 0, 0.5);
  }

  body.night-theme .player-card {
    background: rgba(20, 20, 30, 0.8);
    border-color: rgba(139, 69, 19, 0.4);
    box-shadow: 
      0 8px 32px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  .player-card.dead {
    background: rgba(38, 40, 46, 0.82);
    border-color: rgba(150, 158, 170, 0.45);
    opacity: 0.72;
  }

  body.night-theme .player-card.dead {
    background: rgba(44, 48, 56, 0.78);
    border-color: rgba(165, 175, 190, 0.5);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(200, 210, 225, 0.12);
    opacity: 0.66;
  }

  body.night-theme .player-card.alive {
    border-color: rgba(100, 200, 100, 0.5);
    box-shadow: 
      0 8px 32px rgba(0, 0, 0, 0.3),
      0 0 15px rgba(100, 200, 100, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  body.day-theme .player-card.nominated {
    border-color: rgba(0, 191, 255, 0.8);
    border-width: 3.3px;
    box-shadow: 
      0 0 20px rgba(0, 191, 255, 0.4),
      0 8px 32px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
    animation: pulse-blue 2s ease-in-out infinite;
  }

  @keyframes pulse-blue {
    0%, 100% {
      box-shadow: 
        0 0 20px rgba(0, 191, 255, 0.4),
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    50% {
      box-shadow: 
        0 0 30px rgba(0, 191, 255, 0.6),
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
  }

  body.day-theme .player-card.nominator {
    border-color: rgba(220, 20, 60, 0.8);
    border-width: 3.3px;
    box-shadow:
      0 0 20px rgba(220, 20, 60, 0.4),
      0 8px 32px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
    animation: pulse-red 2s ease-in-out infinite;
  }

  @keyframes pulse-red {
    0%, 100% {
      box-shadow:
        0 0 20px rgba(220, 20, 60, 0.4),
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    50% {
      box-shadow:
        0 0 30px rgba(220, 20, 60, 0.6),
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
  }

  body.day-theme .player-card.self-nominated {
    border-color: rgba(255, 215, 0, 0.85);
    border-width: 3.3px;
    box-shadow:
      0 0 20px rgba(255, 215, 0, 0.5),
      0 8px 32px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
    animation: pulse-gold 2s ease-in-out infinite;
  }

  .nominated-label {
    background: linear-gradient(135deg, rgba(0, 100, 200, 0.9), rgba(0, 50, 150, 0.9));
    color: #00bfff;
    font-family: 'Cinzel', serif;
    font-size: 0.65em;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 8px;
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border: 1px solid rgba(0, 191, 255, 0.5);
    white-space: nowrap;
  }

  .player-avatar {
    width: clamp(34px, 3.2vw, 46px);
    height: clamp(34px, 3.2vw, 46px);
    border-radius: 50%;
    margin: 0 auto 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: clamp(0.9em, 1.4vw, 1.15em);
    color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    border: 2px solid rgba(255, 255, 255, 0.25);
    box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.2), 0 2px 6px rgba(0, 0, 0, 0.4);
  }

  .player-card.dead .player-avatar {
    filter: grayscale(0.7) brightness(0.6);
  }

  /* Dead = ghost: let mist escape the card, give a faint spectral glow. */
  .player-card.dead {
    overflow: visible;
  }
  .player-card.dead .player-name {
    text-shadow: 0 0 8px rgba(190, 198, 210, 0.6);
  }

  /* Animated wispy, wavy border: a ring pseudo-element warped by an SVG
     turbulence filter (which animates via SMIL) and softly pulsing. */
  .player-card.dead::after {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 14px;
    border: 2px solid rgba(190, 200, 214, 0.65);
    box-shadow: 0 0 10px rgba(180, 195, 215, 0.35), inset 0 0 8px rgba(180, 195, 215, 0.25);
    pointer-events: none;
    filter: url(#ghostWisp);
    animation: ghost-border-pulse 3s ease-in-out infinite;
  }

  @keyframes ghost-border-pulse {
    0%, 100% { opacity: 0.5; border-color: rgba(185, 195, 210, 0.5); }
    50%      { opacity: 0.95; border-color: rgba(210, 220, 235, 0.85); }
  }

  /* Mist layer fills the card; puffs spawn around the whole perimeter and
     drift outward in their own direction (--dx,--dy). */
  .card-mist {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: -1;
  }
  .card-mist-puff {
    position: absolute;
    left: var(--px, 50%);
    top: var(--py, 50%);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(210, 216, 226, 0.5) 0%, rgba(180, 188, 202, 0.28) 45%, rgba(170, 180, 195, 0) 72%);
    filter: blur(5px);
    opacity: 0;
    transform: translate(-50%, -50%);
    animation: card-mist-drift 3.6s ease-out infinite;
  }

  @keyframes card-mist-drift {
    0%   { transform: translate(-50%, -50%) translate(0, 0) scale(0.4); opacity: 0; }
    30%  { opacity: var(--mo, 0.3); }
    100% { transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(1.5); opacity: 0; }
  }

  /* Death / revive transitions — applied once when state changes.
     Keep translate(-50%, -50%) in every frame so the card stays centered on its point. */
  @keyframes death-fall {
    0%   { transform: translate(-50%, -50%) scale(1) rotate(0); filter: none; }
    40%  { transform: translate(-50%, -50%) scale(1.08) rotate(-2deg); }
    100% { transform: translate(-50%, -50%) scale(0.96) rotate(0); filter: grayscale(0.7) brightness(0.7); }
  }

  @keyframes revive-rise {
    0%   { transform: translate(-50%, -50%) scale(0.9); filter: grayscale(0.7) brightness(0.6); }
    50%  { transform: translate(-50%, -50%) scale(1.1); filter: brightness(1.4); }
    100% { transform: translate(-50%, -50%) scale(1); filter: none; }
  }

  .player-card.just-died { animation: death-fall 0.9s ease-out; }
  .player-card.just-revived { animation: revive-rise 0.8s ease-out; }

  /* Card reforming after an execution ghost has risen back to its seat. */
  @keyframes materialize {
    0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 0; filter: blur(8px) brightness(2); }
    55%  { opacity: 1; filter: blur(2px) brightness(1.4); }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; filter: none; }
  }
  .player-card.just-materialized { animation: materialize 0.9s ease-out; }

  /* Execution FX: a copy of the living card collapses to the floor, shatters,
     then a ghost rises back to the seat (lerp). Lives in its own overlay so the
     normal render (which clears #playersContainer) never interrupts it.
     --fall = px from the seat down to the bottom of the screen. */
  #execFxLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 60;
    overflow: hidden;
  }
  .exec-fx { position: absolute; }
  .exec-fx > * {
    position: absolute;
    left: 0;
    top: 0;
    transform: translate(-50%, -50%);
  }

  /* The card shatters into 5 jagged fragments. Each is a full copy of the card
     clipped to one wedge; they fly apart (--tx,--ty), spin (--rot) and fade. */
  .exec-piece {
    width: clamp(120px, 10vw, 160px);
    padding: clamp(4px, 1vw, 6px);
    border-radius: 12px;
    background: rgba(20, 20, 30, 0.95);
    border: 2.2px solid rgba(139, 69, 19, 0.5);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    text-align: center;
    color: #fff;
    box-sizing: border-box;
    animation: exec-shatter 1s cubic-bezier(0.33, 0.0, 0.3, 1) forwards;
  }
  /* 5 jagged wedges radiating from the card center. */
  .exec-piece.p0 { clip-path: polygon(50% 50%, 0 18%, 0 0, 44% 0); }
  .exec-piece.p1 { clip-path: polygon(50% 50%, 44% 0, 100% 0, 100% 38%); }
  .exec-piece.p2 { clip-path: polygon(50% 50%, 100% 38%, 100% 100%, 62% 100%); }
  .exec-piece.p3 { clip-path: polygon(50% 50%, 62% 100%, 12% 100%, 0 70%); }
  .exec-piece.p4 { clip-path: polygon(50% 50%, 0 70%, 0 18%); }
  .exec-fx .exec-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    margin: 0 auto 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #fff;
  }

  /* A whole-card copy (no clip) used by the dust / zip / burn variants. */
  .exec-body {
    width: clamp(120px, 10vw, 160px);
    padding: clamp(4px, 1vw, 6px);
    border-radius: 12px;
    background: rgba(20, 20, 30, 0.95);
    border: 2.2px solid rgba(139, 69, 19, 0.5);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    text-align: center;
    color: #fff;
    box-sizing: border-box;
  }

  /* --- Variant 2: fall to the ground, then shatter on impact --- */
  .exec-body.fall { animation: exec-fall var(--fdur, 0.62s) cubic-bezier(0.45, 0, 0.85, 1) forwards; }
  @keyframes exec-fall {
    0%   { transform: translate(-50%, -50%) translateY(0) rotate(0deg); opacity: 1; }
    78%  { transform: translate(-50%, -50%) translateY(var(--fall)) rotate(var(--ftilt, 6deg)); opacity: 1; }
    90%  { transform: translate(-50%, -50%) translateY(var(--fall)) rotate(var(--ftilt, 6deg)) scaleY(0.9) scaleX(1.06); opacity: 1; }
    100% { transform: translate(-50%, -50%) translateY(var(--fall)) rotate(var(--ftilt, 6deg)) scaleY(0.92) scaleX(1.04); opacity: 0; }
  }

  /* --- Variant 3: zip around a random path, fly off screen --- */
  .exec-body.zip { animation: exec-zip 1.5s cubic-bezier(0.5, 0.0, 0.5, 1) forwards; }
  @keyframes exec-zip {
    0%   { transform: translate(-50%, -50%) translate(0, 0) rotate(0deg); opacity: 1; }
    22%  { transform: translate(-50%, -50%) translate(var(--z1x), var(--z1y)) rotate(var(--r1)); opacity: 1; }
    44%  { transform: translate(-50%, -50%) translate(var(--z2x), var(--z2y)) rotate(var(--r2)); opacity: 1; }
    66%  { transform: translate(-50%, -50%) translate(var(--z3x), var(--z3y)) rotate(var(--r3)); opacity: 1; }
    82%  { opacity: 1; }
    100% { transform: translate(-50%, -50%) translate(var(--zfx), var(--zfy)) rotate(var(--rf)); opacity: 0; }
  }

  /* --- Variant 4: burnt at the stake --- */
  /* Card chars GRADUALLY: charring sweeps up from the base via a moving dark
     gradient mask, brightness/saturation lerp down to pure black, then it
     crumbles. brightness() stays continuous so the darkening reads as a lerp. */
  .exec-body.burn {
    position: relative;
    animation: exec-burn 1.95s linear forwards;
  }
  .exec-body.burn::after {
    /* The advancing char front: a black wash rising from the bottom edge. */
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 12px;
    background: linear-gradient(to top,
      rgba(8,7,6,1) 0%, rgba(20,12,8,0.96) 18%,
      rgba(60,24,10,0.7) 30%, rgba(120,50,16,0.35) 40%, rgba(0,0,0,0) 52%);
    background-size: 100% 250%;
    background-position: 0% 0%;
    pointer-events: none;
    animation: exec-char 1.95s ease-in forwards;
  }
  @keyframes exec-burn {
    0%   { filter: brightness(1) saturate(1) contrast(1); opacity: 1; transform: translate(-50%, -50%) scaleY(1); }
    30%  { filter: brightness(0.95) saturate(1.6) contrast(1.05); }
    55%  { filter: brightness(0.6) saturate(1.4) contrast(1.15); }
    78%  { filter: brightness(0.22) saturate(0.6) contrast(1.3); opacity: 1; transform: translate(-50%, -50%) scaleY(0.99); }
    90%  { filter: brightness(0.04) contrast(1.4); opacity: 1; transform: translate(-50%, -50%) scaleY(0.97) translateY(2px); }
    100% { filter: brightness(0); opacity: 0; transform: translate(-50%, -50%) scaleY(0.82) translateY(14px) rotate(2deg); }
  }
  @keyframes exec-char {
    0%   { background-position: 0% 120%; opacity: 0; }
    12%  { opacity: 1; }
    100% { background-position: 0% -10%; opacity: 1; }
  }
  /* Several independent flame tongues stacked at the base, each with its own
     flicker timing/offset so the fire dances instead of pulsing uniformly. */
  .exec-flame {
    width: var(--fw, 80px);
    height: var(--fh, 150px);
    border-radius: 50% 50% 46% 46% / 70% 70% 30% 30%;
    background: radial-gradient(ellipse 60% 80% at 50% 92%,
      rgba(255,248,200,0.98) 0%,
      rgba(255,210,90,0.95) 22%,
      rgba(255,140,30,0.9) 45%,
      rgba(230,70,18,0.7) 66%,
      rgba(150,24,8,0.25) 82%,
      rgba(90,12,6,0) 92%);
    filter: blur(3px);
    mix-blend-mode: screen;
    opacity: 0;
    transform-origin: 50% 100%;
    margin-left: var(--fox, 0px);
    animation:
      exec-flames var(--fdur, 1.7s) ease-in forwards,
      flame-dance var(--flick, 0.22s) ease-in-out infinite alternate;
    animation-delay: var(--fdelay, 0s), var(--fdelay, 0s);
  }
  @keyframes exec-flames {
    0%   { opacity: 0; transform: translate(-50%, -30%) scaleY(0.15) scaleX(0.8); }
    18%  { opacity: 0.95; transform: translate(-50%, -50%) scaleY(1.2) scaleX(1); }
    55%  { opacity: 1; transform: translate(-50%, -50%) scaleY(1.05) scaleX(0.95); }
    80%  { opacity: 0.8; transform: translate(-50%, -55%) scaleY(0.9) scaleX(0.9); }
    100% { opacity: 0; transform: translate(-50%, -60%) scaleY(0.4) scaleX(0.7); }
  }
  /* Flicker only touches filter — exec-flames owns transform (no clobber). */
  @keyframes flame-dance {
    0%   { filter: blur(2.5px) brightness(1.18) hue-rotate(6deg); }
    100% { filter: blur(4.5px) brightness(0.82) hue-rotate(-6deg); }
  }
  .exec-ash {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(70, 66, 62, 0.95) 0%, rgba(40, 38, 36, 0.6) 60%, rgba(30, 28, 26, 0) 78%);
    opacity: 0;
    animation: exec-ash-fall 1.3s ease-in forwards;
    animation-delay: 1.2s;
  }
  @keyframes exec-ash-fall {
    0%   { transform: translate(-50%, -50%) translate(0, 0) scale(1); opacity: 0; }
    18%  { opacity: var(--mo, 0.85); }
    100% { transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(0.6); opacity: 0; }
  }

  .exec-shard {
    width: var(--sw, 16px);
    height: var(--sh, 16px);
    background: linear-gradient(135deg, #d4dde8, #6b7886);
    /* Jagged glass sliver — clip-path set per-shard in JS for randomness. */
    clip-path: var(--clip, polygon(50% 0, 100% 50%, 50% 100%, 0 50%));
    opacity: 0;
    animation: exec-shard-burst var(--sd, 0.85s) cubic-bezier(0.2, 0.6, 0.3, 1) forwards;
    animation-delay: 0.55s;
  }

  .exec-ghost {
    font-size: 2.6em;
    color: rgba(214, 230, 255, 0.92);
    text-shadow:
      0 0 12px rgba(180, 210, 255, 0.9),
      0 0 26px rgba(140, 180, 255, 0.7),
      0 0 44px rgba(120, 160, 255, 0.5);
    opacity: 0;
    white-space: nowrap;
    filter: drop-shadow(0 0 6px rgba(190, 215, 255, 0.6));
    animation:
      exec-ghost-rise 1.3s ease-out forwards,
      ghost-waver 2.2s ease-in-out infinite;
    animation-delay: 0.95s, 0.95s;
  }
  .exec-ghost .exec-ghost-name {
    display: block;
    font-size: 0.42em;
    color: #cdd9ff;
    margin-top: 2px;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(160, 190, 255, 0.8);
  }

  /* Smoky mist billowing up from the seat as the ghost rises. Independent
     siblings (NOT children of the ghost) so the ghost's own fading opacity
     doesn't multiply them away. Each puff drifts up, swells, dissipates. */
  .exec-mist {
    width: 50px;
    height: 50px;
    border-radius: 50%;

  /* Day/night transition: a sun that rises (sunrise) or sets (sunset) over a sky wash */
  #phaseSweep {

<script>
const playersContainer = document.getElementById("playersContainer");
const execFxLayer = document.getElementById("execFxLayer");
const phaseDisplay = document.getElementById("phaseDisplay");
const votesToExecuteDisplay = document.getElementById("votesToExecuteDisplay");
const votesToExecuteText = document.getElementById("votesToExecuteText");
const onBlockDisplay = document.getElementById("onBlockDisplay");
const onBlockName = document.getElementById("onBlockName");
const onBlockVotesDisplay = document.getElementById("onBlockVotes");
const finalDayWarning = document.getElementById("finalDayWarning");
const clockHands = document.getElementById("clockHands");

// Replace with your server IP
const ws = new WebSocket('ws://YOUR_IP:8080');

let players = [];
let phase = "Night";
let phaseNumber = 1;
let onBlockPlayer = null;
let nominatedPlayer = null;
let nominatorPlayer = null;

// Track prior alive state (keyed by name) to animate deaths/revives, and prior phase for the sweep
let prevAlive = {};
let prevPhaseKey = null;
let firstRender = true;
let prevNominationKey = null; // "nominator>nominee" — used to animate only on new nominations
let execFxActive = {};   // player name -> true while its execution FX plays (box hidden)
let materializing = {};  // player name -> true for one render after FX, to fade the box back in

// Deterministic, well-spread avatar color from a name. Two independent hashes
// drive hue (multiplied by the golden angle so near-identical names land far
// apart on the wheel) plus saturation/lightness jitter so emblems stay distinct.
function avatarColor(name) {
  let h1 = 0, h2 = 0;
  for (let i = 0; i < name.length; i++) {
    h1 = (h1 * 31 + name.charCodeAt(i)) >>> 0;
    h2 = (h2 * 131 + name.charCodeAt(i) * 7 + 17) >>> 0;
  }
  const hue = (h1 * 137.508) % 360;          // golden-angle spread
  const sat = 48 + (h2 % 28);                 // 48-75%
  const light = 38 + ((h1 >>> 3) % 16);       // 38-53%
  return `hsl(${hue.toFixed(1)}, ${sat}%, ${light}%)`;
}

function initials(name) {
  const parts = name.trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

// Fire the sunrise (-> day) or sunset (-> night) overlay when the phase changes
let phaseSweepTimer = null;
function runPhaseSweep(phaseKey) {
  const sweep = document.getElementById('phaseSweep');
  if (!sweep) return;
  sweep.className = '';
  // Force reflow so the animation restarts even on rapid toggles
  void sweep.offsetWidth;
  sweep.classList.add('active', phaseKey === 'day' ? 'sunrise' : 'sunset');
  if (phaseSweepTimer) clearTimeout(phaseSweepTimer);
  phaseSweepTimer = setTimeout(() => { sweep.className = ''; }, 10000);

  // Layer a one-shot SFX (rooster at dawn, owl at dusk) over the transition,
  // then the looping background music.
  if (phaseKey === 'day') {
    playSfx('rooster-sounds', 0.4, 1500);
    playRandomSound('morning-sounds');
  } else {
    playSfx('owl-sounds', 0.4, 1500);
    playRandomSound('night-sounds');
  }
}

// Play a random one-shot sound effect layered on top of current audio (does not
// touch the background music track). Fire-and-forget.
// `volume` (0-1) and `delay` (ms before playing) are optional.
function playSfx(category, volume = 0.9, delay = 0) {
  fetch(`/api/sounds/${category}`)
    .then(r => r.ok ? r.json() : [])
    .then(files => {
      if (!files || files.length === 0) return;
      const pick = files[Math.floor(Math.random() * files.length)];
      const sfx = new Audio('/' + pick);
      sfx.volume = volume;
      const start = () => sfx.play().catch(e => console.warn('SFX play blocked:', e));
      if (delay > 0) setTimeout(start, delay); else start();
    })
    .catch(e => console.warn('Could not load SFX:', e));
}

// Execution FX: drop a card copy to the floor, shatter it into shards, then
// raise a ghost back to the seat. (x, y) is the seat center in #playersContainer
// space; since that container fills the viewport it maps 1:1 to the fixed layer.
// Returns ms until the seat should re-materialize the card (after the spirit
// has risen back). Each call randomly picks one of four destruction styles.
function spawnExecutionFx(x, y, name) {
  if (!execFxLayer) return 2200;
  const rect = playersContainer.getBoundingClientRect();
  const px = rect.left + x;
  const py = rect.top + y;

  const fx = document.createElement('div');
  fx.className = 'exec-fx';
  fx.style.left = px + 'px';
  fx.style.top = py + 'px';

  // A full (unclipped) copy of the card, for the variants that move/burn it.
  const makeBody = (cls) => {
    const body = document.createElement('div');
    body.className = 'exec-body ' + cls;
    const av = document.createElement('div');
    av.className = 'exec-avatar';
    av.textContent = initials(name);
    av.style.background = avatarColor(name);
    const nm = document.createElement('div');
    nm.textContent = name;
    body.appendChild(av);
    body.appendChild(nm);
    return body;
  };

  // gd = ghost-rise delay (set after the destruction finishes for each variant).
  const variant = Math.floor(Math.random() * 4);
  let gd;
  if (variant === 0) { gd = 0.95; fxShatter(fx, name, 0, 0); }
  else if (variant === 1) { gd = fxFall(fx, makeBody, name, py); }
  else if (variant === 2) { gd = 1.65; fxZip(fx, makeBody, px, py); }
  else { gd = 2.05; fxBurn(fx, makeBody); }

  // Smoky mist rising from the seat as the ghost ascends (independent siblings
  // so the ghost's own fade can't multiply them away).
  const MIST = 7;
  for (let m = 0; m < MIST; m++) {
    const puff = document.createElement('div');
    puff.className = 'exec-mist';
    puff.style.setProperty('--mx', (m % 2 ? 1 : -1) * (6 + (m % 3) * 12) + 'px');
    puff.style.setProperty('--mo', (0.4 + (m % 3) * 0.12).toFixed(2));
    puff.style.animationDelay = (gd + m * 0.22).toFixed(2) + 's';
    fx.appendChild(puff);
  }

  // Ghost rising from the seat (original position) and fading.
  const ghost = document.createElement('div');
  ghost.className = 'exec-ghost';
  ghost.innerHTML = '👻<span class="exec-ghost-name">' + name + '</span>';
  ghost.style.animationDelay = gd + 's, ' + gd + 's';
  fx.appendChild(ghost);

  const life = (gd + 1.3 + 0.6) * 1000;
  execFxLayer.appendChild(fx);
  setTimeout(() => fx.remove(), life);
  return Math.round((gd + 1.25) * 1000);
}

// Variant 1: shatter into 5 jagged wedges + glass shards.
// delay = seconds before the burst (used when falling first); fy = px vertical
// offset so the burst happens at the floor instead of the seat.
function fxShatter(fx, name, delay, fy) {
  delay = delay || 0;
  fy = fy || 0;
  if (fy) fx.style.setProperty('--fy', fy + 'px');
  const jaggedClip = () => {
    const pts = 5 + Math.floor(Math.random() * 4); // 5-8 vertices
    const coords = [];
    for (let i = 0; i < pts; i++) {
      const a = (Math.PI * 2 * i) / pts + (Math.random() - 0.5) * 0.9;
      const r = 28 + Math.random() * 22;
      coords.push(`${(50 + Math.cos(a) * r).toFixed(0)}% ${(50 + Math.sin(a) * r).toFixed(0)}%`);
    }
    return `polygon(${coords.join(', ')})`;
  };
  const PIECES = 5;
  for (let pc = 0; pc < PIECES; pc++) {
    const piece = document.createElement('div');
    piece.className = 'exec-piece p' + pc;
    const av = document.createElement('div');
    av.className = 'exec-avatar';
    av.textContent = initials(name);
    av.style.background = avatarColor(name);
    const nm = document.createElement('div');
    nm.textContent = name;
    piece.appendChild(av);
    piece.appendChild(nm);
    const ang = (Math.PI * 2 * pc) / PIECES - Math.PI / 2 + (Math.random() - 0.5) * 0.5;
    const dist = 90 + Math.random() * 60;
    piece.style.setProperty('--tx', (Math.cos(ang) * dist).toFixed(0) + 'px');
    piece.style.setProperty('--ty', (Math.sin(ang) * dist).toFixed(0) + 'px');
    piece.style.setProperty('--rot', Math.floor(Math.random() * 120 - 60) + 'deg');
    if (delay) piece.style.animationDelay = delay.toFixed(2) + 's';
    fx.appendChild(piece);
  }
  const SHARDS = 16;
  for (let s = 0; s < SHARDS; s++) {
    const shard = document.createElement('div');
    shard.className = 'exec-shard';
    const ang = Math.random() * Math.PI * 2;
    const dist = 50 + Math.random() * 120;
    const sz = 8 + Math.random() * 16;
    shard.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(0) + 'px');
    shard.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(0) + 'px');
    shard.style.setProperty('--r', Math.floor(Math.random() * 720 - 360) + 'deg');
    shard.style.setProperty('--sw', sz.toFixed(0) + 'px');
    shard.style.setProperty('--sh', (sz * (0.5 + Math.random())).toFixed(0) + 'px');
    shard.style.setProperty('--sd', (0.7 + Math.random() * 0.5).toFixed(2) + 's');
    shard.style.setProperty('--clip', jaggedClip());
    // CSS gives shards a 0.55s lead-in; offset by the fall delay when present.
    shard.style.animationDelay = (delay + 0.55).toFixed(2) + 's';
    fx.appendChild(shard);
  }
}

// Variant 2: fall to the ground, then shatter on impact. Returns ghost delay.
function fxFall(fx, makeBody, name, py) {
  const fall = Math.max(40, window.innerHeight - py - 40);
  const fdur = Math.min(0.95, Math.max(0.45, fall / 1100)); // longer drop = longer fall
  fx.style.setProperty('--fall', fall + 'px');
  const body = makeBody('fall');
  body.style.setProperty('--fdur', fdur.toFixed(2) + 's');
  body.style.setProperty('--ftilt', Math.floor(Math.random() * 16 - 8) + 'deg');
  fx.appendChild(body);
  // Shatter at the floor right as the card lands.
  fxShatter(fx, name, fdur, fall);
  return fdur + 1.15; // ghost rises after the impact shatter
}

// Variant 3: zip ALL OVER the screen then fly off.
function fxZip(fx, makeBody, px, py) {
  const body = makeBody('zip');
  const vw = window.innerWidth, vh = window.innerHeight;
  // Random absolute points anywhere on screen, expressed relative to the seat
  // so the card streaks corner-to-corner across the whole display.
  const wp = (mgn) => ({
    x: (mgn + Math.random() * (vw - 2 * mgn)) - px,
    y: (mgn + Math.random() * (vh - 2 * mgn)) - py,
  });
  const a = wp(80), b = wp(80), c = wp(80);
  body.style.setProperty('--z1x', a.x.toFixed(0) + 'px');
  body.style.setProperty('--z1y', a.y.toFixed(0) + 'px');
  body.style.setProperty('--z2x', b.x.toFixed(0) + 'px');
  body.style.setProperty('--z2y', b.y.toFixed(0) + 'px');
  body.style.setProperty('--z3x', c.x.toFixed(0) + 'px');
  body.style.setProperty('--z3y', c.y.toFixed(0) + 'px');
  body.style.setProperty('--r1', Math.floor(Math.random() * 180 - 90) + 'deg');
  body.style.setProperty('--r2', Math.floor(Math.random() * 360 - 180) + 'deg');
  body.style.setProperty('--r3', Math.floor(Math.random() * 540 - 270) + 'deg');
  // Final flight: straight off the nearest-ish random edge of the viewport.
  const ang = Math.random() * Math.PI * 2;
  const reach = Math.max(window.innerWidth, window.innerHeight) + 300;
  body.style.setProperty('--zfx', (Math.cos(ang) * reach).toFixed(0) + 'px');
  body.style.setProperty('--zfy', (Math.sin(ang) * reach).toFixed(0) + 'px');
  body.style.setProperty('--rf', Math.floor(Math.random() * 720 - 360) + 'deg');
  fx.appendChild(body);
}

// Variant 4: burnt at the stake — dancing flame tongues engulf the card while
// it gradually chars to black, then it crumbles into rising ash.
function fxBurn(fx, makeBody) {
  fx.appendChild(makeBody('burn'));
  // Several flame tongues across the base, staggered for a dancing fire.
  const TONGUES = 6;
  for (let i = 0; i < TONGUES; i++) {
    const fl = document.createElement('div');
    fl.className = 'exec-flame';
    const t = (i + 0.5) / TONGUES;               // 0..1 across the card width
    fl.style.setProperty('--fox', Math.round((t - 0.5) * 120) + 'px');
    fl.style.setProperty('--fw', (50 + Math.random() * 55).toFixed(0) + 'px');
    // Center tongues are tallest; edges shorter, for a flame envelope.
    const tall = 1 - Math.abs(t - 0.5) * 1.2;
    fl.style.setProperty('--fh', (110 + tall * 90 + Math.random() * 30).toFixed(0) + 'px');
    fl.style.setProperty('--fdur', (1.55 + Math.random() * 0.4).toFixed(2) + 's');
    fl.style.setProperty('--flick', (0.16 + Math.random() * 0.14).toFixed(2) + 's');
    fl.style.setProperty('--fdelay', (Math.random() * 0.22).toFixed(2) + 's');
    fx.appendChild(fl);
  }
  // Ash starts rising only once the card has charred (burn runs ~1.95s).
  const ASH = 20;
  for (let a = 0; a < ASH; a++) {
    const ash = document.createElement('div');
    ash.className = 'exec-ash';
    const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.6; // mostly upward
    const dist = 50 + Math.random() * 110;
    ash.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(0) + 'px');
    ash.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(0) + 'px');
    ash.style.setProperty('--mo', (0.5 + Math.random() * 0.4).toFixed(2));
    ash.style.animationDelay = (1.5 + Math.random() * 0.5).toFixed(2) + 's';
    fx.appendChild(ash);
  }
}

// --- Audio playback, remotely controllable from the controller page ---
let currentAudio = null;       // the <audio> element currently loaded
let currentCategory = null;    // category it was picked from (for "change")
let currentTrack = null;       // path of the loaded track (to avoid repeats on change)
let fadeTimer = null;
const AUDIO_VOLUME = 0.7;

// Pick and play a random audio file from an assets sound category.
// `avoid` is an optional track path to skip (so "change" gives a different one).
function playRandomSound(category, avoid) {
  return fetch(`/api/sounds/${category}`)
    .then(r => r.ok ? r.json() : [])
    .then(files => {
      if (!files || files.length === 0) return;
      let pool = files;
      if (avoid && files.length > 1) pool = files.filter(f => f !== avoid);
      const pick = pool[Math.floor(Math.random() * pool.length)];
      stopSound();
      currentCategory = category;
      currentTrack = pick;
      currentAudio = new Audio('/' + pick);
      currentAudio.volume = AUDIO_VOLUME;
      currentAudio.play().catch(e => console.warn('Audio play blocked:', e));
      reportNowPlaying(pick);
    })
    .catch(e => console.warn('Could not load sounds:', e));
}

// Pretty track name from a file path: "assets/night-sounds/Gymnopedie.mp3" -> "Gymnopedie"
function trackLabel(path) {
  if (!path) return null;
  return path.split('/').pop().replace(/\.[^.]+$/, '');
}

// Tell the controller what's playing (partial state; server merges it).
function reportNowPlaying(path) {
  const label = trackLabel(path);
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ nowPlaying: label }));
  }
}

function stopSound() {
  if (fadeTimer) { clearInterval(fadeTimer); fadeTimer = null; }
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
  reportNowPlaying(null);
}

function restartSound() {
  if (fadeTimer) { clearInterval(fadeTimer); fadeTimer = null; }
  if (currentAudio) {
    currentAudio.currentTime = 0;
    currentAudio.volume = AUDIO_VOLUME;
    currentAudio.play().catch(e => console.warn('Audio play blocked:', e));
  }
}

// Fade volume to zero over `ms`, then stop
function fadeOutSound(ms = 4000) {
  if (!currentAudio) return;
  if (fadeTimer) clearInterval(fadeTimer);
  const steps = 40;
  const stepMs = Math.max(20, ms / steps);
  const startVol = currentAudio.volume;
  let i = 0;
  fadeTimer = setInterval(() => {
    i++;
    if (!currentAudio) { clearInterval(fadeTimer); fadeTimer = null; return; }
    currentAudio.volume = Math.max(0, startVol * (1 - i / steps));
    if (i >= steps) { clearInterval(fadeTimer); fadeTimer = null; stopSound(); }
  }, stepMs);
}

function changeSound() {
  const cat = currentCategory || 'morning-sounds';
  playRandomSound(cat, currentTrack);
}

// Dispatch an audio command sent from the controller
function handleAudioCommand(cmd) {
  switch (cmd) {
    case 'fade':    fadeOutSound(); break;
    case 'restart': restartSound(); break;
    case 'stop':    stopSound(); break;
    case 'change':  changeSound(); break;
  }
}

ws.onopen = () => {
  console.log("WebSocket connected!");
  phaseDisplay.classList.remove("connecting");
};
ws.onerror = (err) => console.error("WebSocket error:", err);
ws.onclose = () => console.log("WebSocket closed.");

ws.onmessage = (msg) => {
  const data = JSON.parse(msg.data);
  players = data.players || [];
  phase = data.phase || phase;
  phaseNumber = data.phaseNumber || phaseNumber;
  onBlockPlayer = data.onBlockPlayer !== undefined ? data.onBlockPlayer : onBlockPlayer;
  onBlockVotes = data.onBlockVotes !== undefined ? data.onBlockVotes : onBlockVotes;
  nominatedPlayer = data.nominatedPlayer !== undefined ? data.nominatedPlayer : nominatedPlayer;
  nominatorPlayer = data.nominatorPlayer !== undefined ? data.nominatorPlayer : nominatorPlayer;

  // Audio command from controller — nonce-gated so each press fires once
  if (data.audioCmd && data.audioCmd.nonce !== undefined && data.audioCmd.nonce !== lastAudioNonce) {
    lastAudioNonce = data.audioCmd.nonce;
    handleAudioCommand(data.audioCmd.action);
  }

  render();
};
let lastAudioNonce = null;

function render() {
  phaseDisplay.textContent = `${phase} ${phaseNumber}`;
  playersContainer.innerHTML = "";

  // Update theme based on phase
  const phaseKey = phase.toLowerCase() === 'day' ? 'day' : 'night';
  document.body.className = phaseKey === 'day' ? 'day-theme' : 'night-theme';

  // Sweep on phase change (skip the very first render / connect)
  if (!firstRender && prevPhaseKey !== null && prevPhaseKey !== phaseKey) {
    runPhaseSweep(phaseKey);
  }
  prevPhaseKey = phaseKey;


  // Calculate player statistics
  const totalPlayers = players.length;
  const alivePlayers = players.filter(p => p.alive).length;
  const deadPlayers = totalPlayers - alivePlayers;
  
  // Update statistics display
  document.getElementById('totalPlayers').textContent = totalPlayers;
  document.getElementById('alivePlayers').textContent = alivePlayers;
  document.getElementById('deadPlayers').textContent = deadPlayers;
  
  // Final day warning: in BotC the game nears its end at 3 or 4 alive players
  const isDay = phase.toLowerCase() === 'day';
  if (isDay && (alivePlayers === 3 || alivePlayers === 4)) {
    finalDayWarning.classList.add('visible');
  } else {
    finalDayWarning.classList.remove('visible');
  }

  // Show conditional legend items only when active on a player
  const anyExecuted = players.some(p => !p.alive && p.deathCause === 'executed');
  const anyKilled = players.some(p => !p.alive && p.deathCause === 'killed');
  const anyNominator = isDay && players.some(p => p.hasNominated);
  const anyNominee = isDay && players.some(p => p.hasBeenNominated);
  setLegendVisible('executedLegendItem', anyExecuted);
  setLegendVisible('killedLegendItem', anyKilled);
  setLegendVisible('nominatorLegendItem', anyNominator);
  setLegendVisible('nomineeLegendItem', anyNominee);

  // Update on-block display - hide the center widget
  onBlockDisplay.style.display = 'none';
  
  // Calculate votes needed to execute
  // If someone is on the block: max(half alive, votes on block + 1)
  // Otherwise: half the alive players (rounded up)
  const halfAlive = Math.ceil(alivePlayers / 2);
  const votesNeeded = onBlockPlayer !== null 
    ? Math.max(halfAlive, onBlockVotes + 1)
    : halfAlive;
  
  // Update votes to execute display below phase widget
  const votesNeededText = nominatedPlayer !== null && players[nominatedPlayer] 
    ? `Votes needed to execute ${players[nominatedPlayer].name}: ${votesNeeded}`
    : `Votes needed to execute: ${votesNeeded}`;
  votesToExecuteText.textContent = votesNeededText;
  votesToExecuteDisplay.style.display = phase.toLowerCase() === 'day' ? 'block' : 'none';
  
  // Update distribution information
  updateDistributionInfo();

  // Calculate oval layout for up to 20 players
  const containerWidth = playersContainer.clientWidth;
  const containerHeight = playersContainer.clientHeight;
  const vw = containerWidth / 100;
  const safeMargin = Math.max(60, Math.min(8 * vw, 80)); // Safe margin from edges
  const maxRadiusX = (containerWidth - safeMargin * 2) / 2.0;
  const maxRadiusY = (containerHeight - safeMargin * 2) / 2.0; // Extend to bottom with margins
  const centerX = containerWidth / 2;
  const total = players.length;
  const centerY = containerHeight * 0.5;

  // Use constant maximum radius for all player counts (tightened to bring circle closer)
  const radiusX = maxRadiusX * 0.82;
  const radiusY = maxRadiusY * 0.82;
  
  // Calculate angle step based on player count - more players = smaller angles between them
  // Start from top and spread evenly around the oval
  const startAngle = -Math.PI / 2; // Top of oval
  const angleStep = (2 * Math.PI) / total;

  const playerPositions = [];
  players.forEach((p, i) => {
    const angle = startAngle + (i * angleStep);
    const x = centerX + radiusX * Math.cos(angle);
    const y = centerY + radiusY * Math.sin(angle);
    playerPositions[i] = { x, y };

    const div = document.createElement("div");
    const isOnBlock = phase.toLowerCase() === 'day' && onBlockPlayer === i;
    const isNominated = phase.toLowerCase() === 'day' && nominatedPlayer === i;
    const isNominator = phase.toLowerCase() === 'day' && nominatorPlayer === i;
    const isSelfNom = isNominated && isNominator; // self-nomination
    // Detect alive->dead / dead->alive transitions to animate once
    let transitionClass = '';
    if (!firstRender && prevAlive[p.name] !== undefined && prevAlive[p.name] !== p.alive) {
      transitionClass = p.alive ? 'just-revived' : 'just-died';
      // Town execution gets the full collapse/shatter/ghost FX + a sound.
      // Hide the real card for the duration; the ghost reforms it on the way up.
      if (!p.alive && p.deathCause === 'executed') {
        const name = p.name;
        execFxActive[name] = true;
        const revealAt = spawnExecutionFx(x, y, name);
        playSfx('death-sounds', 0.7);
        // When the spirit has risen back, reveal the card with a materialize
        // fade-in. Timing depends on which destruction variant played.
        setTimeout(() => {
          delete execFxActive[name];
          materializing[name] = true;
          render();
        }, revealAt);
      }
    }
    // Skip drawing the card body while its execution FX owns the seat.
    if (execFxActive[p.name]) return;
    if (materializing[p.name]) { transitionClass = 'just-materialized'; delete materializing[p.name]; }

    div.className = `player-card ${!p.alive ? 'dead' : ''} ${p.alive && !isOnBlock ? 'alive' : ''} ${isOnBlock ? 'on-block' : ''} ${isSelfNom ? 'self-nominated' : (isNominated ? 'nominated' : '')} ${!isSelfNom && isNominator ? 'nominator' : ''} ${transitionClass}`;

    div.style.left = `${x}px`;
    div.style.top = `${y}px`;

    const avatar = document.createElement("div");
    avatar.className = "player-avatar";
    avatar.textContent = initials(p.name);
    avatar.style.background = avatarColor(p.name);

    const nameDiv = document.createElement("div");
    nameDiv.className = "player-name";
    nameDiv.textContent = p.name;

    const statusDiv = document.createElement("div");
    statusDiv.className = "player-status";

    div.appendChild(avatar);
    div.appendChild(nameDiv);

    // Dead players are ghosts: billow smoky mist off every side of the card.
    // Puffs spawn around the whole perimeter and drift outward.
    if (!p.alive) {
      const mistWrap = document.createElement("div");
      mistWrap.className = "card-mist";
      const MIST = 10;
      for (let m = 0; m < MIST; m++) {
        const puff = document.createElement("div");
        puff.className = "card-mist-puff";
        const a = (Math.PI * 2 * m) / MIST + (m % 2 ? 0.25 : -0.2);
        // Spawn point on the card edge (ellipse), in %.
        const sx = 50 + Math.cos(a) * 52;
        const sy = 50 + Math.sin(a) * 56;
        puff.style.setProperty('--px', sx.toFixed(0) + '%');
        puff.style.setProperty('--py', sy.toFixed(0) + '%');
        // Outward drift in px, away from center.
        puff.style.setProperty('--dx', (Math.cos(a) * 26).toFixed(0) + 'px');
        puff.style.setProperty('--dy', (Math.sin(a) * 26 - 8).toFixed(0) + 'px');
        puff.style.setProperty('--mo', (0.26 + (m % 3) * 0.08).toFixed(2));
        puff.style.animationDelay = (m * 0.36).toFixed(2) + 's';
        mistWrap.appendChild(puff);
      }
      div.appendChild(mistWrap);
    }

    // Add nominated label if this player is nominated during day
    if (phase.toLowerCase() === 'day' && nominatedPlayer === i) {
      const nominatedLabel = document.createElement("div");
      nominatedLabel.className = "nominated-label";
      nominatedLabel.textContent = "⭐ Nominated";
      div.appendChild(nominatedLabel);
    } else if (phase.toLowerCase() === 'day' && onBlockPlayer === i) {
      const onBlockLabel = document.createElement("div");
      onBlockLabel.className = "on-block-label";
      onBlockLabel.innerHTML = `🗡️ ${onBlockVotes} Vote${onBlockVotes !== 1 ? 's' : ''}`;
      div.appendChild(onBlockLabel);
    } else if (p.alive) {
      const candle = document.createElement("span");
      candle.className = "status-icon";
      candle.textContent = "🕯️";
      candle.style.color = "#ffa500";
      statusDiv.appendChild(candle);
    } else if (!p.alive) {
      const skull = document.createElement("span");
      skull.className = "status-icon";
      // Distinguish town execution from demon/night kill
      if (p.deathCause === 'executed') {
        skull.textContent = "⚖️";
        skull.style.color = "#ff8c00";
      } else if (p.deathCause === 'killed') {
        skull.textContent = "🔪";
        skull.style.color = "#dc143c";
      } else {
        skull.textContent = "💀";
        skull.style.color = "#dc143c";
      }
      statusDiv.appendChild(skull);
      if (p.ghostVote) {
      const ghost = document.createElement("span");
      ghost.className = "status-icon ghost-vote";
      ghost.textContent = "👻";
      ghost.style.color = "#9370db";
      statusDiv.appendChild(ghost);
      }
    }
    
    if (p.traveler) {
      const traveler = document.createElement("span");
      traveler.className = "status-icon";
      traveler.textContent = "🎒";
      traveler.style.color = "#4169e1";
      statusDiv.appendChild(traveler);
    }

    // Nominator / nominee history persists through the day
    if (isDay && p.hasNominated) {
      const nominator = document.createElement("span");
      nominator.className = "status-icon";
      nominator.textContent = "👉";
      nominator.style.color = "#00bfff";
      statusDiv.appendChild(nominator);
    }
    if (isDay && p.hasBeenNominated) {
      const nominee = document.createElement("span");
      nominee.className = "status-icon";
      nominee.textContent = "🕐";
      nominee.style.color = "#ff6b6b";
      statusDiv.appendChild(nominee);
    }

    div.appendChild(statusDiv);

    playersContainer.appendChild(div);
  });

  // Snapshot alive state for next render's transition detection
  prevAlive = {};
  players.forEach(p => { prevAlive[p.name] = p.alive; });
  firstRender = false;

  // Animate the hands spinning in only when the nomination pair is newly set
  const nominationKey = (phaseKey === 'day' && nominatorPlayer !== null && nominatedPlayer !== null)
    ? `${nominatorPlayer}>${nominatedPlayer}` : null;
  const animateHands = nominationKey !== null && nominationKey !== prevNominationKey;
  prevNominationKey = nominationKey;

  drawClockHands(playerPositions, centerX, centerY, animateHands);
}

// Draw a clock connecting the nominator (hour hand) to the nominee (minute hand).
// Hour hand is short and thick; minute hand is long and thin — classic clock convention.
function drawClockHands(positions, cx, cy, animate) {
  clockHands.innerHTML = "";
  const isDay = phase.toLowerCase() === 'day';
  if (!isDay || nominatorPlayer === null || nominatedPlayer === null) return;
  if (!positions[nominatorPlayer] || !positions[nominatedPlayer]) return;

  clockHands.setAttribute("viewBox", `0 0 ${clockHands.clientWidth} ${clockHands.clientHeight}`);

  const nom = positions[nominatorPlayer];
  const nee = positions[nominatedPlayer];

  const ns = "http://www.w3.org/2000/svg";

  // Self-nomination: nominator and nominee are the same player -> yellow
  const isSelf = nominatorPlayer === nominatedPlayer;
  const hourColor = isSelf ? "#ffd700" : "#dc143c";
  const minuteColor = isSelf ? "#ffd700" : "#00bfff";

  // Hour hand -> nominator (short, ornate). Minute hand -> nominee (long, ornate).
  const hour = handShape(ns, cx, cy, nom.x, nom.y, 0.62, hourColor, 9, 22);
  const minute = handShape(ns, cx, cy, nee.x, nee.y, 0.82, minuteColor, 7, 30);

  if (animate) {
    // Spin each hand in around the hub. Different sweeps/durations -> parallax.
    // Minute hand spins faster & further (like a real clock), hour settles slower.
    spinHand(ns, hour, cx, cy, 1.5, 2.6);
    spinHand(ns, minute, cx, cy, 3.5, 3.4);
  }

  // Ornate central hub: gold ring + dark cap
  const hubRing = document.createElementNS(ns, "circle");
  hubRing.setAttribute("cx", cx);
  hubRing.setAttribute("cy", cy);
  hubRing.setAttribute("r", 11);
  hubRing.setAttribute("fill", "#d4af37");
  hubRing.setAttribute("stroke", "rgba(0,0,0,0.6)");
  hubRing.setAttribute("stroke-width", "2");
  const hubCap = document.createElementNS(ns, "circle");
  hubCap.setAttribute("cx", cx);
  hubCap.setAttribute("cy", cy);
  hubCap.setAttribute("r", 4.5);
  hubCap.setAttribute("fill", "#2b2b2b");

  clockHands.appendChild(hour);
  clockHands.appendChild(minute);
  clockHands.appendChild(hubRing);
  clockHands.appendChild(hubCap);
}

// Attach a one-shot spin-into-place rotation about (cx,cy).
// `turns` full revolutions, `dur` seconds, easing out so it decelerates onto the target.
function spinHand(ns, el, cx, cy, turns, dur) {
  const from = -360 * turns;
  const anim = document.createElementNS(ns, "animateTransform");
  anim.setAttribute("attributeName", "transform");
  anim.setAttribute("type", "rotate");
  anim.setAttribute("from", `${from} ${cx} ${cy}`);
  anim.setAttribute("to", `0 ${cx} ${cy}`);
  anim.setAttribute("dur", `${dur}s`);
  anim.setAttribute("repeatCount", "1");
  anim.setAttribute("fill", "freeze");
  // Decelerate into final position
  anim.setAttribute("calcMode", "spline");
  anim.setAttribute("keyTimes", "0;1");
  anim.setAttribute("keySplines", "0.15 0.85 0.3 1");
  // Start on demand (a freshly inserted SMIL element with begin=0s would treat
  // time 0 as already past and snap to the end).
  anim.setAttribute("begin", "indefinite");
  el.appendChild(anim);
  // beginElement only works once the node is in the live document
  requestAnimationFrame(() => { try { anim.beginElement(); } catch (e) {} });
}

// Build an ornate, tapered clock hand pointing from the hub toward a target.
// Classic leaf/spade silhouette: counterweight tail, slim neck, diamond near the
// tip, then a fine point. `reach` (0-1) of full distance, `w` base width, `tail` length.
function handShape(ns, cx, cy, tx, ty, reach, color, w, tail) {
  const dx = tx - cx, dy = ty - cy;
  const dist = Math.hypot(dx, dy) || 1;
  const ux = dx / dist, uy = dy / dist;       // unit vector toward target
  const nx = -uy, ny = ux;                     // perpendicular
  const L = dist * reach;                      // hand length

  // Point helper: a along the hand axis, b perpendicular, from the hub
  const P = (a, b) => `${(cx + ux * a + nx * b).toFixed(1)},${(cy + uy * a + ny * b).toFixed(1)}`;

  const wn = w * 0.45;            // neck half-width
  const wd = w * 0.85;            // diamond half-width
  const d = [
    `M ${P(-tail, 0)}`,                 // counterweight tip (behind hub)
    `L ${P(-tail * 0.4, w * 0.6)}`,     // tail shoulder (left)
    `L ${P(L * 0.12, wn)}`,             // neck (left)
    `L ${P(L * 0.66, wd)}`,             // diamond widest (left)
    `L ${P(L, 0)}`,                     // fine point at tip
    `L ${P(L * 0.66, -wd)}`,            // diamond widest (right)
    `L ${P(L * 0.12, -wn)}`,            // neck (right)
    `L ${P(-tail * 0.4, -w * 0.6)}`,    // tail shoulder (right)
    'Z'
  ].join(' ');

  const path = document.createElementNS(ns, "path");
  path.setAttribute("d", d);
  path.setAttribute("fill", color);
  path.setAttribute("stroke", "rgba(0,0,0,0.55)");
  path.setAttribute("stroke-width", "1.2");
  path.setAttribute("stroke-linejoin", "round");
  path.setAttribute("filter", "drop-shadow(0 2px 5px rgba(0,0,0,0.6))");
  return path;
}

// Toggle a legend row's visibility by id
function setLegendVisible(id, visible) {
  const el = document.getElementById(id);
  if (el) el.style.display = visible ? 'flex' : 'none';
}

function updateDistributionInfo() {
  // Count non-traveler players
  const nonTravelers = players.filter(p => !p.traveler);
  const playerCount = nonTravelers.length;
  const travelers = players.filter(p => p.traveler).length;
  
  // Official Blood on the Clocktower distribution table
  let townsfolk = 0, outsiders = 0, minions = 0, demons = 0;
  
  if (playerCount >= 5 && playerCount <= 5) {
    townsfolk = 3; outsiders = 0; minions = 1; demons = 1;
  } else if (playerCount === 6) {
    townsfolk = 3; outsiders = 1; minions = 1; demons = 1;
  } else if (playerCount === 7) {
    townsfolk = 5; outsiders = 0; minions = 1; demons = 1;
  } else if (playerCount === 8) {
    townsfolk = 5; outsiders = 1; minions = 1; demons = 1;
  } else if (playerCount === 9) {
    townsfolk = 5; outsiders = 2; minions = 1; demons = 1;
  } else if (playerCount === 10) {
    townsfolk = 7; outsiders = 0; minions = 2; demons = 1;
  } else if (playerCount === 11) {
    townsfolk = 7; outsiders = 1; minions = 2; demons = 1;
  } else if (playerCount === 12) {
    townsfolk = 7; outsiders = 2; minions = 2; demons = 1;
  } else if (playerCount === 13) {
    townsfolk = 9; outsiders = 0; minions = 3; demons = 1;
  } else if (playerCount === 14) {
    townsfolk = 9; outsiders = 1; minions = 3; demons = 1;
  } else if (playerCount >= 15) {
    townsfolk = 9; outsiders = 2; minions = 3; demons = 1;
  }
  
  // Update display elements
  document.getElementById('townsfolkCount').textContent = townsfolk;
  document.getElementById('outsidersCount').textContent = outsiders;
  document.getElementById('minionsCount').textContent = minions;
  document.getElementById('demonCount').textContent = demons;
  document.getElementById('travelersCount').textContent = travelers;
  
  // Hide traveler row and legend item if no travelers
  const travelerRow = document.getElementById('travelerRow');
  const travelerLegendItem = document.getElementById('travelerLegendItem');
  if (travelers === 0) {
    travelerRow.style.display = 'none';
    travelerLegendItem.style.display = 'none';
  } else {
    travelerRow.style.display = 'flex';
    travelerLegendItem.style.display = 'flex';
  }
}
